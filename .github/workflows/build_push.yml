name: BUILD RELEASE

on:
  push:
    branches:
      - main
      - master
    paths:
      - '**'
      - '!**.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build app
    runs-on: ubuntu-24.04

    steps:
      - name: Clone repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17 (LTS)
        uses: actions/setup-java@v4
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Node.js LTS (24.x)
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Write google-services.json & client_secrets.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_CLIENT_SECRETS_JSON: ${{ secrets.GOOGLE_CLIENT_SECRETS_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "google-services.json written."
          else
            echo "No GOOGLE_SERVICES_JSON provided, skipping."
          fi
          if [ -n "$GOOGLE_CLIENT_SECRETS_JSON" ]; then
            mkdir -p app/src/main/assets
            echo "$GOOGLE_CLIENT_SECRETS_JSON" > app/src/main/assets/client_secrets.json
            echo "client_secrets.json written."
          fi

      - name: Build release APK
        run: ./gradlew assembleRelease -Penable-updater

      - name: Sign APK
        id: sign_apk
        uses: r0adkll/sign-android-release@f30bdd30588842ac76044ecdbd4b6d0e3e813478
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: '35.0.1'

      - name: Verify APK signature
        run: |
          set -e
          APK_FILE=$(find app/build/outputs/apk/release/ -name "*signed*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: No signed APK was produced. Aborting."
            exit 1
          fi
          echo "Verifying signature of: $APK_FILE"
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose "$APK_FILE"
          echo "Signature OK."

      - name: Rename APK
        id: current_commit
        run: |
          set -e
          version_tag=$(echo ${GITHUB_REF/refs\/heads\//} | sed -r 's/^refs\/(heads|tags)\///' | sed -r 's/[-\/]+/_/g')
          commit_count=$(git rev-list --count HEAD)
          echo "VERSION_TAG=$version_tag" >> $GITHUB_OUTPUT
          echo "COMMIT_COUNT=$commit_count" >> $GITHUB_OUTPUT

          # Strict: only accept a signed APK — no fallback to unsigned
          APK_FILE=$(find app/build/outputs/apk/release/ -name "*signed*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: No signed APK found after verification step."
            exit 1
          fi

          DEST="Yomiku-${version_tag}-r${commit_count}.apk"
          cp "$APK_FILE" "./$DEST"
          echo "APK_NAME=$DEST" >> $GITHUB_OUTPUT
          echo "Output APK: $DEST"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.current_commit.outputs.APK_NAME }}
          path: ./${{ steps.current_commit.outputs.APK_NAME }}
          # Single file — no zip wrapping
          if-no-files-found: error

      - name: Upload mapping
        uses: actions/upload-artifact@v4
        with:
          name: mapping-${{ github.sha }}
          path: app/build/outputs/mapping/release
          if-no-files-found: warn
