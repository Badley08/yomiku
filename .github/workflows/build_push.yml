name: CI
on:
  push:
    branches:
      - main
      - master
    paths:
      - '**'
      - '!**.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build app
    runs-on: 'ubuntu-24.04'

    steps:
      - name: Clone repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17 (LTS)
        uses: actions/setup-java@v4
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Node.js LTS (24.x)
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build app
        run: ./gradlew assembleRelease -Penable-updater || ./gradlew assemblePreview

      - name: Sign APK (if key available)
        continue-on-error: true
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: '35.0.1'

      - name: Prepare Output APK
        id: current_commit
        run: |
          set -e
          version_tag=$(echo ${GITHUB_REF/refs\/heads\//} | sed -r 's/^refs\/(heads|tags)\///' | sed -r 's/[-\/]+/_/g')
          commit_count=$(git rev-list --count HEAD)
          echo "VERSION_TAG=$version_tag" >> $GITHUB_OUTPUT
          echo "COMMIT_COUNT=$commit_count" >> $GITHUB_OUTPUT
          # Prefer signed APK if present, otherwise fallback to unsigned APK
          APK_FILE=$(find app/build/outputs/apk/release/ -name "*signed*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          fi
          echo "Copying $APK_FILE to Yomiku-$version_tag-r$commit_count.apk"
          cp "$APK_FILE" ./Yomiku-$version_tag-r$commit_count.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Yomiku-${{ steps.current_commit.outputs.VERSION_TAG }}-r${{ steps.current_commit.outputs.COMMIT_COUNT }}
          path: ./*.apk

      - name: Upload mapping
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mapping-${{ github.sha }}
          path: app/build/outputs/mapping/release
