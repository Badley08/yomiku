name: BUILD RELEASE

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
    paths:
      - '**'
      - '!**.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build app
    runs-on: ubuntu-24.04

    steps:
      - name: Clone repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17 (LTS)
        uses: actions/setup-java@v4
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Node.js LTS (24.x)
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Write google-services.json & client_secrets.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_CLIENT_SECRETS_JSON: ${{ secrets.GOOGLE_CLIENT_SECRETS_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "google-services.json written."
          else
            echo "No GOOGLE_SERVICES_JSON provided, skipping."
          fi
          if [ -n "$GOOGLE_CLIENT_SECRETS_JSON" ]; then
            mkdir -p app/src/main/assets
            echo "$GOOGLE_CLIENT_SECRETS_JSON" > app/src/main/assets/client_secrets.json
            echo "client_secrets.json written."
          fi

      - name: Build release APK
        run: ./gradlew assembleRelease -Penable-updater

      - name: Sign APK
        id: sign_apk
        uses: r0adkll/sign-android-release@f30bdd30588842ac76044ecdbd4b6d0e3e813478
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: '35.0.1'

      - name: Verify APK signature
        run: |
          set -e
          echo "Verifying signatures of all signed release APKs..."
          found=0
          for apk in app/build/outputs/apk/release/*-signed.apk; do
            [ -f "$apk" ] || continue
            found=1
            echo "Verifying signature of: $apk"
            "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose "$apk"
          done
          if [ "$found" -eq 0 ]; then
            echo "ERROR: No signed APK found to verify."
            exit 1
          fi
          echo "All signed APK signatures verified successfully."

      - name: Prepare release artifacts
        id: prepare_release
        run: |
          set -e
          mkdir -p dist
          commit_count=$(git rev-list --count HEAD)
          commit_sha=$(git rev-parse --short HEAD)

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
            RELEASE_TITLE="Yomiku ${TAG_NAME}"
          else
            TAG_NAME="v1.14.1-r${commit_count}"
            RELEASE_TITLE="Yomiku v1.14.1 (r${commit_count})"
          fi

          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "RELEASE_TITLE=$RELEASE_TITLE" >> $GITHUB_OUTPUT
          echo "COMMIT_COUNT=$commit_count" >> $GITHUB_OUTPUT
          echo "COMMIT_SHA=$commit_sha" >> $GITHUB_OUTPUT

          # Copy ARM APKs with clean, direct filenames
          if [ -f "app/build/outputs/apk/release/app-arm64-v8a-release-unsigned-signed.apk" ]; then
            cp "app/build/outputs/apk/release/app-arm64-v8a-release-unsigned-signed.apk" "dist/Yomiku-arm64-v8a.apk"
          fi
          if [ -f "app/build/outputs/apk/release/app-armeabi-v7a-release-unsigned-signed.apk" ]; then
            cp "app/build/outputs/apk/release/app-armeabi-v7a-release-unsigned-signed.apk" "dist/Yomiku-armeabi-v7a.apk"
          fi
          if [ -f "app/build/outputs/apk/release/app-universal-release-unsigned-signed.apk" ]; then
            cp "app/build/outputs/apk/release/app-universal-release-unsigned-signed.apk" "dist/Yomiku-universal.apk"
          fi

          cat << 'EOF' | sed 's/^          //' > dist/release_notes.md
          ## 🚀 Yomiku Release

          ### 📱 Fichiers APK (Téléchargement direct)

          Téléchargez et installez directement l'application sur votre appareil Android (aucun fichier zip à extraire) :

          | Fichier APK | Architecture | Appareils recommandés |
          |---|---|---|
          | **`Yomiku-arm64-v8a.apk`** | ARM 64-bit (`arm64-v8a`) | **Recommandé** pour la quasi-totalité des smartphones récents (64-bit) |
          | **`Yomiku-armeabi-v7a.apk`** | ARM 32-bit (`armeabi-v7a`) | Anciens appareils Android (32-bit) |
          | **`Yomiku-universal.apk`** | Universel (ARMv7 + ARMv8) | Compatible avec tous les téléphones et tablettes Android |

          ---

          ### ✨ Nouveautés & Optimisations
          - **Architectures 100% ARM** : Binaires optimisés pour processeurs mobiles ARMv7 et ARMv8 (librairies x86/x86_64 exclues pour un fichier léger et rapide).
          - **Identité Visuelle Yomiku** : Nouveau logo vectoriel Hiragana japonais « よ » Bleu Ciel Pâle.
          - **Temps de Lecture & Statistiques** : Bascule dynamique entre affichage en Heures ou en Jours + Minutes avec persistance.
          - **Synchronisation ManLore** : Exportation directe des métadonnées UI/UX et temps de lecture.
          - **Sécurité Renforcée** : Service worker hermétique et zéro avertissement de compilation Kotlin 2.4.
          - **Signature Officielle de Production** : APK signé avec keystore officiel (installation directe sans avertissement de package corrompu).

          ---
          *Compilé automatiquement par GitHub Actions sur la branche `main`.*
          EOF

          echo "APKs in dist/:"
          ls -la dist/

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG_NAME="${{ steps.prepare_release.outputs.TAG_NAME }}"
          RELEASE_TITLE="${{ steps.prepare_release.outputs.RELEASE_TITLE }}"

          echo "Publishing GitHub Release: $TAG_NAME ($RELEASE_TITLE)..."
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists, updating assets..."
            gh release upload "$TAG_NAME" dist/Yomiku-*.apk --clobber
            gh release edit "$TAG_NAME" --title "$RELEASE_TITLE" --notes-file dist/release_notes.md --latest
          else
            gh release create "$TAG_NAME" dist/Yomiku-*.apk \
              --title "$RELEASE_TITLE" \
              --notes-file dist/release_notes.md \
              --latest
          fi
          echo "GitHub Release published successfully!"

      - name: Upload APKs to workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Yomiku-APKs-${{ steps.prepare_release.outputs.COMMIT_COUNT }}
          path: dist/Yomiku-*.apk
          if-no-files-found: error

      - name: Upload mapping
        uses: actions/upload-artifact@v4
        with:
          name: mapping-${{ github.sha }}
          path: app/build/outputs/mapping/release
          if-no-files-found: warn
